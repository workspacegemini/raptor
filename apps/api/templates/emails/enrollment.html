<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Course Enrollment Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #4CAF50; color: white; padding: 30px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #ffffff; padding: 30px; border: 1px solid #e0e0e0; }
        .button { display: inline-block; padding: 12px 30px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✓ You're Enrolled!</h1>
        </div>
        <div class="content">
            <h2>Hi {{userName}},</h2>
            <p>Great news! You've been successfully enrolled in <strong>{{courseName}}</strong>.</p>

            <p>This course will help you develop new skills and advance your career. Start learning at your own pace!</p>

            <a href="{{courseUrl}}" class="button">Start Learning</a>

            <p>Good luck with your learning journey!</p>
        </div>
    </div>
</body>
</html>
