version: '3.8'

services:
  # MinIO - S3-compatible object storage for local development
  minio:
    image: minio/minio:latest
    container_name: epe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'  # MinIO API
      - '9001:9001'  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - epe-network

  # Create default bucket on startup
  minio-create-bucket:
    image: minio/mc:latest
    container_name: epe-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/epe-storage --ignore-existing;
      /usr/bin/mc anonymous set download myminio/epe-storage/avatars;
      /usr/bin/mc anonymous set download myminio/epe-storage/courses/thumbnails;
      /usr/bin/mc anonymous set download myminio/epe-storage/organizations/logos;
      echo 'MinIO bucket setup complete';
      "
    networks:
      - epe-network

volumes:
  minio_data:
    driver: local

networks:
  epe-network:
    driver: bridge
